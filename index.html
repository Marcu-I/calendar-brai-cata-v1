  <style id="dark-mode-css">
    /* ===== MOD INTUNECAT - culori regandite pentru tot calendarul ===== */
    html.dark { color-scheme: dark; }
    html.dark body { background: #0a0f0d !important; }

    /* Fundal pagina principala (are stil inline cu gradient alb) */
    html.dark #root > div {
      background: radial-gradient(1200px 600px at 20% -10%, rgba(52,211,153,0.14), transparent), radial-gradient(900px 500px at 90% 0%, rgba(56,189,248,0.10), transparent), #0b120f !important;
    }
    html.dark header {
      background: linear-gradient(105deg, rgba(22,163,74,0.22) 0%, rgba(11,18,15,0.98) 45%, rgba(14,116,144,0.16) 100%) !important;
      border-color: #1e332b !important;
    }
    /* Cercuri blur din header */
    html.dark [class*="bg-emerald-200/30"] { background-color: rgba(52,211,153,0.16) !important; }
    html.dark [class*="bg-sky-200/25"] { background-color: rgba(56,189,248,0.14) !important; }
    html.dark [class*="bg-emerald-400/10"] { background-color: rgba(52,211,153,0.12) !important; }

    /* --- Fundaluri generale --- */
    html.dark [class*="bg-white"] { background-color: #1a2420 !important; }
    html.dark [class*="bg-white/80"] { background-color: rgba(26,36,32,0.85) !important; }
    html.dark [class*="bg-zinc-50"] { background-color: #1e2a24 !important; }
    html.dark [class*="bg-zinc-100"] { background-color: #222f29 !important; }
    html.dark [class*="bg-emerald-50"] { background-color: #16211c !important; }
    html.dark [class*="bg-emerald-100"] { background-color: #1e3329 !important; }
    html.dark [class*="bg-[#f0fdf4]"] { background-color: #16211c !important; }
    html.dark [class*="bg-[#f8fdf9]"] { background-color: #16211c !important; }
    html.dark [class*="bg-amber-50"] { background-color: #2a230a !important; }
    html.dark [class*="bg-sky-50"] { background-color: #16222f !important; }

    /* Carduri cu gradient - le facem fundal solid inchis, sa nu ramana pete albe */
    html.dark [class*="bg-gradient-to-br"] { background-image: none !important; background-color: #1a2420 !important; }
    html.dark [class*="from-amber-50"],
    html.dark [class*="from-sky-50"],
    html.dark [class*="from-emerald-50"],
    html.dark [class*="from-red-50"],
    html.dark [class*="from-white"],
    html.dark [class*="from-zinc-50"] { --tw-gradient-from: #1a2420 !important; }
    html.dark [class*="to-yellow-50"],
    html.dark [class*="to-blue-50"],
    html.dark [class*="to-green-50"],
    html.dark [class*="to-rose-50"],
    html.dark [class*="to-white"],
    html.dark [class*="to-zinc-50"] { --tw-gradient-to: #1a2420 !important; }

    /* --- Culorile sacilor - fundaluri deschise devin inchise, dar raman distincte --- */
    html.dark [class*="bg-[#fef9c3]"] { background-color: #2e2a0a !important; }
    html.dark [class*="bg-[#dbeafe]"] { background-color: #1a2b45 !important; }
    html.dark [class*="bg-[#dcfce7]"] { background-color: #142f20 !important; }
    /* Zilele colorate din calendar raman vii, sa se vada pe fundal inchis */
    html.dark [class*="bg-[#facc15]"] { background-color: #eab308 !important; }
    html.dark [class*="bg-[#60a5fa]"] { background-color: #3b82f6 !important; }
    html.dark [class*="bg-[#22c55e]"] { background-color: #22c55e !important; }
    html.dark [class*="bg-[#4ade80]"] { background-color: #22c55e !important; }
    html.dark [class*="bg-[#86efac]"] { background-color: #4ade80 !important; }
    html.dark [class*="bg-[#ef4444]"] { background-color: #dc2626 !important; }
    html.dark [class*="bg-[#16a34a]"] { background-color: #16a34a !important; }
    /* Badge-uri inchise deja - le luminam putin ca sa se vada */
    html.dark [class*="bg-zinc-800"] { background-color: #2e3d36 !important; }
    html.dark [class*="bg-zinc-900"] { background-color: #1f2937 !important; }
    /* Overlay modale - mai inchis */
    html.dark [class*="bg-black/50"] { background-color: rgba(0,0,0,0.72) !important; }
    html.dark [class*="bg-black/55"] { background-color: rgba(0,0,0,0.75) !important; }

    /* --- Text --- */
    html.dark [class*="text-zinc-900"] { color: #f0fdf4 !important; }
    html.dark [class*="text-zinc-800"] { color: #e2e8f0 !important; }
    html.dark [class*="text-zinc-700"] { color: #cbd5e1 !important; }
    html.dark [class*="text-zinc-600"] { color: #a8b8ae !important; }
    html.dark [class*="text-zinc-500"] { color: #8fa89c !important; }
    html.dark [class*="text-zinc-400"] { color: #6b857a !important; }
    html.dark [class*="text-zinc-300"] { color: #a8b8ae !important; }
    html.dark [class*="text-zinc-200"] { color: #e2e8f0 !important; }
    html.dark [class*="text-[#14532d]"] { color: #bbf7d0 !important; }
    html.dark [class*="text-[#166534]"] { color: #86efac !important; }
    html.dark [class*="text-[#15803d]"] { color: #4ade80 !important; }
    html.dark [class*="text-[#16a34a]"] { color: #4ade80 !important; }
    html.dark [class*="text-[#4a5a4f]"] { color: #b8c9bd !important; }
    html.dark [class*="text-[#2563eb]"] { color: #93c5fd !important; }
    html.dark [class*="text-[#a16207]"] { color: #fde68a !important; }
    html.dark [class*="text-[#422006]"] { color: #fef3c7 !important; }
    html.dark [class*="text-emerald-700"] { color: #6ee7b7 !important; }
    html.dark [class*="text-emerald-800"] { color: #a7f3d0 !important; }
    html.dark [class*="text-emerald-300"] { color: #6ee7b7 !important; }
    html.dark [class*="text-sky-800"] { color: #93c5fd !important; }
    html.dark [class*="text-sky-700"] { color: #7dd3fc !important; }
    html.dark [class*="text-amber-800"] { color: #fde68a !important; }
    html.dark [class*="text-amber-700"] { color: #fcd34d !important; }
    html.dark [class*="text-red-600"] { color: #fca5a5 !important; }
    /* Textul de pe zilele galbene din calendar ramane inchis, ca sa se citeasca pe galben */
    html.dark .grid-cols-7 [class*="text-zinc-900"] { color: #422006 !important; }
    html.dark .grid-cols-7 [class*="text-zinc-600"] { color: #a8b8ae !important; }
    html.dark .grid-cols-7 [class*="text-zinc-500"] { color: #8fa89c !important; }
    /* Inelul verde pentru ziua de azi ramane vizibil */
    html.dark [class*="ring-[#16a34a]"] { --tw-ring-color: #4ade80 !important; }

    /* --- Borduri --- */
    html.dark [class*="border-zinc-100"] { border-color: #2a3831 !important; }
    html.dark [class*="border-zinc-200"] { border-color: #33453b !important; }
    html.dark [class*="border-zinc-50"] { border-color: #2a3831 !important; }
    html.dark [class*="border-emerald-100"] { border-color: #1e3a2e !important; }
    html.dark [class*="border-emerald-200"] { border-color: #24543d !important; }
    html.dark [class*="border-amber-100"] { border-color: #4a3a0a !important; }
    html.dark [class*="border-amber-200"] { border-color: #4a3a0a !important; }
    html.dark [class*="border-sky-100"] { border-color: #1e3a5f !important; }
    html.dark [class*="border-sky-200"] { border-color: #1e3a5f !important; }
    html.dark [class*="border-red-200"] { border-color: #4a1a1a !important; }
    html.dark [class*="border-[#facc15]"] { border-color: #a16207 !important; }
    html.dark [class*="border-[#60a5fa]"] { border-color: #2563eb !important; }
    html.dark [class*="border-[#4ade80]"] { border-color: #16a34a !important; }
    html.dark [class*="border-[#bbf7d0]"] { border-color: #24543d !important; }
    html.dark [class*="border-[#16a34a]"] { border-color: #16a34a !important; }
    html.dark [class*="border-emerald-400"] { border-color: #34d399 !important; }

    /* --- Inputuri si butoane --- */
    html.dark input { background-color: #1a2420 !important; color: #f0fdf4 !important; border-color: #24543d !important; }
    html.dark input::placeholder { color: #6b857a !important; }
    html.dark [class*="placeholder:text-zinc-400"]::placeholder { color: #6b857a !important; }
    html.dark [class*="hover:bg-zinc-50"]:hover { background-color: #222f29 !important; }
    html.dark [class*="hover:bg-emerald-50"]:hover { background-color: #1e3329 !important; }
    html.dark [class*="hover:bg-[#f0fdf4]"]:hover { background-color: #1e3329 !important; }
    html.dark [class*="hover:bg-zinc-200"]:hover { background-color: #33453b !important; }
    html.dark [class*="hover:text-black"]:hover { color: #f0fdf4 !important; }
    html.dark [class*="hover:text-[#16a34a]"]:hover { color: #4ade80 !important; }

    /* Umbre - mai pronuntate pe fundal inchis */
    html.dark [class*="shadow-[0_10px_40px"] { box-shadow: 0 10px 40px rgba(0,0,0,0.45) !important; }
    html.dark [class*="shadow-[0_12px_40px"] { box-shadow: 0 12px 40px rgba(0,0,0,0.5) !important; }
    html.dark [class*="shadow-[0_6px_24px"] { box-shadow: 0 6px 24px rgba(0,0,0,0.4) !important; }
    html.dark [class*="shadow-[0_4px_20px"] { box-shadow: 0 4px 20px rgba(0,0,0,0.4) !important; }

    /* Logo - ramane pe card alb ca sa se vada */
    html.dark div:has(> img[alt="Brai-Cata Logo"]) { background-color: #ffffff !important; }
    html.dark div:has(> img[alt="Brai-Cata"]) { background-color: #ffffff !important; }
    html.dark img[alt="Brai-Cata Logo"], html.dark img[alt="Brai-Cata"] { background: #fff; border-radius: 8px; }

    /* Footer verde deschis devine inchis */
    html.dark footer { background-color: #101a15 !important; border-color: #1e332b !important; }

    /* Butonul de dark mode - nu e afectat de regulile de mai sus */
    #dark-mode-toggle {
      position: fixed; right: 16px; bottom: 16px; z-index: 200;
      display: flex; align-items: center; gap: 8px;
      height: 48px; padding: 0 18px; border-radius: 9999px;
      background: #111827; color: #f0fdf4; border: 1px solid #374151;
      font-size: 13px; font-weight: 800; cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      transition: transform .15s ease, background .2s ease;
    }
    #dark-mode-toggle:hover { transform: scale(1.04); }
    #dark-mode-toggle:active { transform: scale(0.97); }
    html.dark #dark-mode-toggle { background: #f0fdf4; color: #111827; border-color: #e5e7eb; }
    @media (max-width: 640px) {
      #dark-mode-toggle { right: 12px; bottom: 12px; height: 44px; padding: 0 14px; font-size: 12px; }
      #dark-mode-toggle .dark-toggle-label { display: none; }
    }
  </style>

  <script>
    (function () {
      var btn = document.getElementById('dark-mode-toggle');
      var icon = document.getElementById('dark-mode-icon');
      var label = document.getElementById('dark-mode-label');
      if (!btn) return;
      function sync() {
        var isDark = document.documentElement.classList.contains('dark');
        if (icon) icon.textContent = isDark ? '☀️' : '🌙';
        if (label) label.textContent = isDark ? 'Mod luminos' : 'Mod întunecat';
        btn.setAttribute('aria-pressed', isDark ? 'true' : 'false');
      }
      btn.addEventListener('click', function () {
        var isDark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('calendar-dark', isDark ? '1' : '0'); } catch (e) {}
        sync();
      });
      // Daca sistemul se schimba si userul n-a ales manual, urmarim sistemul
      try {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        if (mq && mq.addEventListener) {
          mq.addEventListener('change', function (e) {
            if (localStorage.getItem('calendar-dark') === null) {
              document.documentElement.classList.toggle('dark', e.matches);
              sync();
            }
          });
        }
      } catch (e) {}
      sync();
    })();
  </script>


  <script>
    (function () {
      // 1. Inregistreaza Service Worker pentru offline
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').then(function (reg) {
            console.log('SW inregistrat:', reg.scope);
          }).catch(function (err) {
            console.log('SW nu s-a putut inregistra:', err);
          });
        });
      }
      // 2. Buton Instaleaza - Android / Desktop
      var installBtn = document.getElementById('pwa-install-btn');
      var deferredPrompt = null;
      function isStandalone() {
        return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      }
      if (installBtn && !isStandalone()) {
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          deferredPrompt = e;
          installBtn.classList.add('show');
        });
        installBtn.addEventListener('click', function () {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function (choice) {
            if (choice.outcome === 'accepted') {
              installBtn.classList.remove('show');
            }
            deferredPrompt = null;
          });
        });
        window.addEventListener('appinstalled', function () {
          installBtn.classList.remove('show');
          deferredPrompt = null;
        });
        // Daca e deja instalat, ascunde butonul
        if (isStandalone()) installBtn.classList.remove('show');
      }
      // 3. Hint iOS - arata o data
      var iosHint = document.getElementById('pwa-ios-hint');
      var iosClose = document.getElementById('pwa-ios-close');
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (iosHint && isIOS && !isStandalone()) {
        try {
          if (!localStorage.getItem('pwa-ios-hint-dismissed')) {
            setTimeout(function () { iosHint.classList.add('show'); }, 2500);
          }
        } catch (e) { iosHint.classList.add('show'); }
      }
      if (iosClose) {
        iosClose.addEventListener('click', function () {
          if (iosHint) iosHint.classList.remove('show');
          try { localStorage.setItem('pwa-ios-hint-dismissed', '1'); } catch (e) {}
        });
      }
    })();
  </script>
